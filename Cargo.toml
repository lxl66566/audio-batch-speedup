[package]
name        = "audio-batch-speedup"
version     = "0.1.3"
edition     = "2024"
description = "Batch speed up audio files"
repository  = "https://github.com/lxl66566/audio-batch-speedup"
license     = "MIT"
keywords    = ["audio", "batch", "cli", "ffmpeg", "speedup"]
categories  = ["multimedia::audio"]
exclude     = [".github", ".vscode"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name              = "abs"
path              = "src/main.rs"
required-features = ["bin"]

[dependencies]
anyhow            = { version = "1.0", optional = true }
bitflags          = "2"
clap              = { version = "4.6", features = ["derive"], optional = true }
indicatif         = "0.18"
log               = "0.4"
pretty_env_logger = { version = "0.5", optional = true }
tempfile          = "3.24"
walkdir           = "2.3"
youpipe           = { version = "0.6", default-features = false }

[features]
bin = ["anyhow", "clap", "pretty_env_logger"]

[lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"

[profile.release]
opt-level = "s"
strip     = true
# No `panic = "abort"`: youpipe's pool panic-safety (leaf cleanup + panic
# propagation) and its compile-time guard require unwinding.
lto       = true
