[package]
categories  = ["multimedia::audio"]
description = "Batch speed up audio files"
edition     = "2024"
exclude     = [".github", ".vscode"]
keywords    = ["audio", "speedup", "batch", "ffmpeg", "cli"]
license     = "MIT"
name        = "audio-batch-speedup"
repository  = "https://github.com/lxl66566/audio-batch-speedup"
version     = "0.1.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow            = { version = "1.0", optional = true }
bitflags          = "2"
clap              = { version = "4.6", optional = true, features = ["derive"] }
indicatif         = "0.18"
log               = "0.4"
pretty_env_logger = { version = "0.5", optional = true }
tempfile          = "3.24"
walkdir           = "2.3"
youpipe           = { version = "0.6", default-features = false }

[features]
bin = ["anyhow", "clap", "pretty_env_logger"]

[[bin]]
name              = "abs"
path              = "src/main.rs"
required-features = ["bin"]


[profile.release]
# No `panic = "abort"`: youpipe's pool panic-safety (leaf cleanup + panic
# propagation) and its compile-time guard require unwinding.
lto       = true
opt-level = "s"
strip     = true
